name: CI

# Every push and PR builds a loadable extension and attaches the zip. That zip
# is what "a fresh build on every commit" means here: downloadable from the run,
# without minting a Release for a commit nobody asked to publish.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Two packages, two lockfiles — both are installed below, so both
          # belong in the cache key.
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      # The MCP server is its own npm package, with its own lockfile and its own
      # dependencies, and a plain root install does not reach it — there are no
      # workspaces, deliberately, because it is published to npm on its own.
      # tests/mcp-pagination spawns it for real, so `@modelcontextprotocol/sdk`
      # has to be on disk before the tests run. The root `postinstall` installs
      # it, which is what keeps a fresh clone working for humans too; this job
      # deliberately has no extra step, so CI fails the day that hook stops
      # firing rather than papering over it.
      - run: npm ci

      # A change to what ships has to be written down under ## Unreleased before
      # it can be released.
      - name: Changelog is documented
        run: npm run lint:changelog
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}

      # One step, not eight, because the list is not this file's to keep.
      #
      # This job used to enumerate the gates, and it had drifted: `verify` runs
      # eight checks and CI ran four of them, so `lint:settings-ui`,
      # `lint:brand`, `lint:vocab` and `lint:locate` were green here no matter
      # what they would have said. That is the worst kind of gap — a repository
      # whose contributors reasonably believe CI runs the gate, and a branch
      # that goes red only on the next person's machine. Naming the gates twice
      # guarantees the copies diverge; the only question is when.
      #
      # `npm run verify` is the done-gate `package.json` defines and the one
      # `npm run package` runs before it writes a zip, so a gate added there is
      # now enforced here the same day. It ends with `npm run build`, which is
      # what the packaging steps below read out of `dist/`. Its `pretest` builds
      # `mcp-server/core.js` first — generated rather than committed, and needed
      # on disk by two suites, one of which spawns the real server.
      #
      # The changelog gate stays its own step above: it needs two commits to
      # compare, which is not a question a single working tree can answer, and
      # `verify` deliberately does not include it.
      - name: Verify
        run: npm run verify

      # The version lives in two files. Catch drift here rather than at tag
      # time, where the release workflow would refuse to publish.
      - name: Versions agree
        run: |
          PKG=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./public/manifest.json').version")
          test "$PKG" = "$MANIFEST" || {
            echo "::error::package.json is $PKG but public/manifest.json is $MANIFEST — run npm run sync-version"
            exit 1
          }

      # A dist/ that Chrome would reject is worth catching before a human tries
      # to load it.
      - name: Extension loads as an unpacked directory
        run: |
          for f in manifest.json background.js content.js popup.html viewer.html settings.html injected/agent.js; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          node -e "
            const m = require('./dist/manifest.json');
            const fs = require('node:fs');
            const refs = [
              m.background.service_worker,
              m.action.default_popup,
              m.options_ui?.page,
              ...m.content_scripts.flatMap(c => [...(c.js ?? []), ...(c.css ?? [])]),
              ...Object.values(m.icons),
              // Web-accessible paths are easy to leave behind when an asset is
              // renamed, and Chrome reports the failure only at runtime.
              ...(m.web_accessible_resources ?? []).flatMap(r => r.resources ?? []),
            ].filter(Boolean);
            const missing = refs.filter(r => !fs.existsSync('dist/' + r));
            if (missing.length) {
              console.error('::error::manifest references missing files: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('manifest references ' + refs.length + ' files, all present');
          "

      - name: Package
        run: node scripts/package.mjs --sha ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: devflow-${{ github.sha }}
          path: releases/*.zip
          if-no-files-found: error
