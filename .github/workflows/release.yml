name: Release

# Triggered either by pushing a tag (v1.1.0) or by manual trigger (workflow_dispatch)
# with a bump type (patch, minor, major).
#
# Manual trigger:
# - Renames ## Unreleased in CHANGELOG.md to the new version with today's date
# - Bumps version in package.json, manifest, mcp-server & lockfiles
# - Commits, tags, and pushes back to main
# - Verifies, builds, zips dist/, attaches zip to GitHub Release, and publishes to npm
#
# Tag push:
# - Verifies, builds, zips dist/, attaches zip to GitHub Release, and publishes to npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  # Called by auto-release.yml when a push to main changes something that
  # ships. One publishing mechanism, two ways in — a second workflow that
  # published on its own would be a second thing to keep correct, and the two
  # would drift the first time one of them learned something.
  workflow_call:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: string

permissions:
  contents: write
  # npm provenance — signs the published package against this workflow run.
  id-token: write

# Releases run one at a time, never cancelled.
#
# Two concurrent runs both cut a version, and the second one's push is rejected
# because the first moved main — which is how this repository acquired a `v4.0.1`
# tag on origin pointing at a commit reachable from nothing. Cancelling instead
# of queueing would be worse: a run killed between its push and its publish
# leaves a tagged version that never reached npm.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Two packages, two lockfiles — both are installed below, so both
          # belong in the cache key.
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
          # Writes the .npmrc that the publish step's NODE_AUTH_TOKEN slots into.
          registry-url: https://registry.npmjs.org

      # The MCP server is its own npm package, with its own lockfile and its own
      # dependencies, and a plain root install does not reach it — there are no
      # workspaces, deliberately, because it is published to npm on its own.
      # tests/mcp-pagination spawns it for real, so `@modelcontextprotocol/sdk`
      # has to be on disk before the tests run. The root `postinstall` installs
      # it, which is what keeps a fresh clone working for humans too.
      - run: npm ci

      # Keyed on the input, not on `github.event_name`. Inside a reusable
      # workflow `event_name` reports the *caller's* event, which for
      # auto-release.yml is `push` — indistinguishable from a tag push, which
      # must not cut a second release of a version that already exists. A bump
      # input is present for a dispatch and for a call, and absent for a tag.
      - name: Cut release and push tag
        if: inputs.bump != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Cut from what main actually is, not from what the checkout captured
          # when this run was queued. A release that ships the commit that
          # triggered it while main has moved on publishes a version whose
          # contents nobody can find by looking at the branch.
          BEFORE=$(git rev-parse HEAD)
          git fetch origin main
          git reset --hard origin/main

          # `npm ci` ran above, against the tree this run checked out. If the
          # reset moved us, that install is for a different lockfile, and the
          # verify below would gate the new code against the old dependencies.
          if [ "$BEFORE" != "$(git rev-parse HEAD)" ]; then
            echo "::notice::main moved while this run was queued — reinstalling."
            npm ci
          fi

          node scripts/cut-release.mjs ${{ inputs.bump }}
          VERSION=$(node -p "require('./package.json').version")

          # `--atomic`, and the tag named rather than `--tags`.
          #
          # Without `--atomic` git updates each ref independently, so a rejected
          # branch push still lets the tag through — leaving a version tagged on
          # origin, pointing at a commit reachable from nothing, that was never
          # published and that blocks every later attempt to release that number.
          # That is not hypothetical: it is what happened to v4.0.1.
          #
          # `--tags` would also push every stale tag the runner happens to hold.
          git push --atomic origin HEAD:main "v$VERSION"

          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"

      - name: Set tag name for push event
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # A release whose zip reports a different version than its tag is worse
      # than no release — Chrome shows the manifest version, not the tag. The
      # MCP server is in here too: it ships to npm from this same tag, and a
      # server that disagrees with the extension it was published beside makes
      # "which one do I have" unanswerable.
      - name: Tag matches every version file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./public/manifest.json').version")
          MCP=$(node -p "require('./mcp-server/package.json').version")
          echo "tag=$TAG package.json=$PKG manifest.json=$MANIFEST mcp-server=$MCP"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$MCP" ]; then
            echo "::error::Version mismatch — bump package.json and run npm run sync-version before tagging."
            exit 1
          fi

      - name: Verify and build
        run: npm run verify

      - name: Package
        run: node scripts/package.mjs

      - uses: softprops/action-gh-release@v2
        if: env.TAG_NAME != ''
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: releases/*.zip
          generate_release_notes: true
          body: |
            ### Install the extension

            1. Download the `.zip` below and unzip it.
            2. Open `chrome://extensions`, enable **Developer mode**.
            3. **Load unpacked** → select the unzipped folder.
            4. Pin DevFlow to the toolbar and press **Start Recording**.

            ### Connect it to Claude Code

            ```sh
            claude mcp add devflow --scope user -- npx -y devflow-server
            ```

            One command, every project, CLI and VS Code alike. Record a flow,
            press **Send**, and ask Claude about it.

            See the [changelog](https://github.com/ansh-n-chovatiya/DevFlow/blob/main/CHANGELOG.md) for what changed.

      # Still useful on a manual dispatch or artifact inspection.
      - uses: actions/upload-artifact@v4
        with:
          name: devflow
          path: releases/*.zip

      # Last, so a registry problem cannot cost us the extension release — that
      # zip is the artifact people cannot get any other way.
      #
      # The version is guaranteed to equal the tag by the check at the top of
      # this job, so pushing a tag is the only thing needed to publish.
      - name: Publish devflow-server to npm
        if: env.TAG_NAME != ''
        working-directory: mcp-server
        run: |
          # `core.js` is `src/core/` bundled in by `npm run build:mcp`, which the
          # verify step above runs. It is listed in `files`, and npm does not
          # complain about a listed file that is missing — so without this check
          # a publish that skipped the build ships a server that throws
          # ERR_MODULE_NOT_FOUND on its first tool call, and only for users.
          if [ ! -f core.js ]; then
            echo "::error::mcp-server/core.js is missing — run npm run build:mcp before publishing."
            exit 1
          fi

          VERSION=$(node -p "require('./package.json').version")

          # A re-run, a re-pushed tag or a manual dispatch would otherwise fail
          # the job on "cannot publish over previously published versions" —
          # a red pipeline for a release that is already correct. Empty output
          # covers both an unpublished version and a package that does not
          # exist yet, which exit codes alone do not distinguish.
          PUBLISHED=$(npm view "devflow-server@$VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "::notice::devflow-server@$VERSION is already on npm — nothing to publish."
            exit 0
          fi

          # Both ways of authenticating are supported, so moving from one to the
          # other is a change on npmjs.com rather than a change to this file.
          # A token is how the package gets published the first time — trusted
          # publishing is configured *on* a package, so it cannot bootstrap one.
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing devflow-server@$VERSION with NPM_TOKEN."
            npm publish --access public --provenance
          else
            echo "No NPM_TOKEN — authenticating with trusted publishing (OIDC)."
            # OIDC needs npm >= 11.5.1 and Node 22 ships npm 10. Only on this
            # path, so the token path does not pay for the upgrade.
            npm install -g npm@latest
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish devflow-compiler-plugin to npm
        if: env.TAG_NAME != ''
        working-directory: compiler-plugin
        run: |
          # A second package, published from the same tag and the same version —
          # `sync-version.mjs` is what keeps them in step, and
          # `tests/versions.test.ts` fails the gate above if they drift.
          #
          # It has no build step and no lockfile: no dependencies, only a
          # `@babel/core` peer. So there is nothing here matching the server's
          # `core.js` check, because there is nothing generated to be missing.
          VERSION=$(node -p "require('./package.json').version")

          PUBLISHED=$(npm view "devflow-compiler-plugin@$VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "::notice::devflow-compiler-plugin@$VERSION is already on npm — nothing to publish."
            exit 0
          fi

          # Same two authentication paths as the server above, for the same
          # reason: a token bootstraps the first publish, and trusted publishing
          # takes over once it can be configured on an existing package.
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing devflow-compiler-plugin@$VERSION with NPM_TOKEN."
            npm publish --access public --provenance
          else
            echo "No NPM_TOKEN — authenticating with trusted publishing (OIDC)."
            npm install -g npm@latest
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
